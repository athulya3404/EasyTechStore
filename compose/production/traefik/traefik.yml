log:
  level: INFO

entryPoints:
  web:
    # http
    address: ':80'

  web-secure:
    # https
    address: ':443'

certificatesResolvers:
  letsencrypt:
    # https://doc.traefik.io/traefik/https/acme/#lets-encrypt
    acme:
      email: 'athulya3404@gmail.com'
      storage: /etc/traefik/acme/acme.json
      # https://doc.traefik.io/traefik/https/acme/#httpchallenge
      httpChallenge:
        entryPoint: web

http:
  routers:
    web-router:
      rule: 'PathPrefix(`/`)'
      entryPoints:
        - web
      middlewares:
        - csrf
      service: django

    web-media-http-router:
      rule: 'PathPrefix(`/media/`)'
      entryPoints:
        - web
      priority: 1000
      service: django-media

    web-secure-router:
      rule: 'Host(`easystore1.me`) || Host(`www.easystore1.me`) || PathPrefix(`/`)'
      entryPoints:
        - web-secure
      middlewares:
        - csrf
      service: django
      tls:
        certResolver: letsencrypt
        domains:
          - main: easystore1.me
            sans:
              - www.easystore1.me

    web-media-router:
      rule: 'PathPrefix(`/media/`)'
      entryPoints:
        - web-secure
      priority: 1000
      middlewares:
        - csrf
      service: django-media
      tls:
        certResolver: letsencrypt

  middlewares:
    csrf:
      # https://doc.traefik.io/traefik/master/middlewares/http/headers/#hostsproxyheaders
      # https://docs.djangoproject.com/en/dev/ref/csrf/#ajax
      headers:
        hostsProxyHeaders: ['X-CSRFToken']

  services:
    django:
      loadBalancer:
        servers:
          - url: http://django:5000

    django-media:
      loadBalancer:
        servers:
          - url: http://nginx:80

providers:
  # https://doc.traefik.io/traefik/master/providers/file/
  file:
    filename: /etc/traefik/traefik.yml
    watch: true
