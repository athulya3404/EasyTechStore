services:
  docs:
    image: electronics_shopping_website_local_docs
    container_name: electronics_shopping_website_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./electronics_shopping_website:/app/electronics_shopping_website:z
    ports:
      - '9000:9000'
    command: /start-docs
