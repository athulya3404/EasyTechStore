{% load i18n %}
<nav class="navbar navbar-expand-md navbar-light bg-light shadow-sm mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="{% url 'home' %}">EasyTech</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'home' %}">Home</a>
        </li>
        <!-- Link to your Categories -->


      </ul>

      <ul class="navbar-nav align-items-center">
        <!-- Cart Icon -->
        <li class="nav-item me-3">
          <a class="nav-link position-relative" href="/cart/">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-cart3"
              viewBox="0 0 16 16">
              <path
                d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .49.598l-1 5a.5.5 0 0 1-.465.401l-9.397.472L4.415 11H13a.5.5 0 0 1 0 1H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM3.102 4l.84 4.479 9.144-.459L13.89 4H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z" />
            </svg>
          </a>
        </li>

        <!-- Authentication Links -->
        {% if request.user.is_authenticated %}
        {% if request.user.is_staff or request.user.is_superuser %}
        <li class="nav-item me-2">
          <a class="btn btn-warning btn-sm fw-bold" href="{% url 'manager:home' %}">
            Manager Dashboard
          </a>
        </li>
        {% endif %}
        <li class="nav-item">
          <a class="nav-link" href="{% url 'users:detail' request.user.pk %}">{% trans "My Profile" %}</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-danger" href="{% url 'account_logout' %}">{% trans "Sign Out" %}</a>
        </li>
        {% else %}
        <li class="nav-item">
          <a class="nav-link" href="{% url 'account_login' %}">{% trans "Sign In" %}</a>
        </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
