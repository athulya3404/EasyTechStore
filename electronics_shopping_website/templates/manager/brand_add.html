{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Brand - EasyTech Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/manager.css' %}">
</head>
<body>
    <div class="manager-wrapper">
        {% include "manager/_sidebar.html" %}

        <main class="manager-content">
            <header class="manager-topbar">
                <div class="topbar-left">
                    <button class="mobile-toggle" id="mobileSidebarToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="page-title">
                        <i class="fas fa-tag" style="color: var(--primary);"></i>
                        Add New Brand
                    </h1>
                </div>
                <div class="topbar-right">
                    <a href="{% url 'manager:brands' %}" class="btn btn-secondary btn-sm">
                        <i class="fas fa-arrow-left"></i> All Brands
                    </a>
                </div>
            </header>

            <div class="manager-container">
                {% if messages %}
                    <div class="manager-alert-container">
                        {% for message in messages %}
                            <div class="manager-alert manager-alert-{{ message.tags }}">
                                <span><i class="fas fa-info-circle"></i> {{ message }}</span>
                                <button type="button" onclick="this.parentElement.remove()" style="background:none;border:none;cursor:pointer;color:inherit;">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}

                <div class="manager-card form-layout">
                    <div class="card-top">
                        <div class="card-top-title">
                            <i class="fas fa-award"></i> Brand Details
                        </div>
                    </div>

                    <div class="card-body">
                        <form method="POST">
                            {% csrf_token %}

                            <div class="form-group">
                                <label class="form-label" for="brandName">Brand Name <span class="required">*</span></label>
                                <input type="text" id="brandName" name="name" class="form-control" placeholder="e.g. Apple, HP, Sony, Samsung, Lenovo, Dell" required>
                                <div class="form-hint">Brand name must be unique.</div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="brandDescription">Brand Description</label>
                                <textarea id="brandDescription" name="description" class="form-control" rows="4" placeholder="Brief manufacturer information, warranty notes, or brand background..."></textarea>
                            </div>

                            <div style="display: flex; gap: 14px; margin-top: 30px; border-top: 1px solid #f1f5f9; padding-top: 20px;">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-check"></i> Create Brand
                                </button>
                                <a href="{% url 'manager:brands' %}" class="btn btn-secondary">
                                    <i class="fas fa-times"></i> Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="{% static 'js/manager.js' %}"></script>
</body>
</html>
