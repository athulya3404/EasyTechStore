{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Category - EasyTech Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/manager.css' %}">
</head>
<body>
    <div class="manager-wrapper">
        {% include "manager/_sidebar.html" %}

        <main class="manager-content">
            <header class="manager-topbar">
                <div class="topbar-left">
                    <button class="mobile-toggle" id="mobileSidebarToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="page-title">
                        <i class="fas fa-folder-plus" style="color: var(--primary);"></i>
                        Add New Category
                    </h1>
                </div>
                <div class="topbar-right">
                    <a href="{% url 'manager:categories' %}" class="btn btn-secondary btn-sm">
                        <i class="fas fa-arrow-left"></i> All Categories
                    </a>
                </div>
            </header>

            <div class="manager-container">
                {% if messages %}
                    <div class="manager-alert-container">
                        {% for message in messages %}
                            <div class="manager-alert manager-alert-{{ message.tags }}">
                                <span><i class="fas fa-info-circle"></i> {{ message }}</span>
                                <button type="button" onclick="this.parentElement.remove()" style="background:none;border:none;cursor:pointer;color:inherit;">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}

                <div class="manager-card form-layout">
                    <div class="card-top">
                        <div class="card-top-title">
                            <i class="fas fa-layer-group"></i> Category Details
                        </div>
                    </div>

                    <div class="card-body">
                        <form method="POST">
                            {% csrf_token %}

                            <div class="form-group">
                                <label class="form-label" for="categoryName">Category Name <span class="required">*</span></label>
                                <input type="text" id="categoryName" name="name" class="form-control" placeholder="e.g. Laptops, Smartphones, Smartwatches, Headphones, Cameras, Accessories" required>
                                <div class="form-hint">Must be unique across the store.</div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="categoryDescription">Category Description</label>
                                <textarea id="categoryDescription" name="description" class="form-control" rows="4" placeholder="Brief summary of electronic products grouped under this category..."></textarea>
                            </div>

                            <div class="form-group" style="padding-top: 6px;">
                                <label class="form-switch">
                                    <input type="checkbox" name="is_active" checked>
                                    <div>
                                        <div style="font-weight: 700;">Active Category</div>
                                        <div style="font-size: 0.78rem; color: var(--text-muted);">Enable to display category in customer menus and filter bars.</div>
                                    </div>
                                </label>
                            </div>

                            <div style="display: flex; gap: 14px; margin-top: 30px; border-top: 1px solid #f1f5f9; padding-top: 20px;">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-check"></i> Create Category
                                </button>
                                <a href="{% url 'manager:categories' %}" class="btn btn-secondary">
                                    <i class="fas fa-times"></i> Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="{% static 'js/manager.js' %}"></script>
</body>
</html>
