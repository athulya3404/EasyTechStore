<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Confirm Your Email - EasyTech Store</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
  <div style="background-color: #0d6efd; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0;">
    <h1 style="margin: 0; font-size: 24px;">EasyTech Store - Email Verification</h1>
  </div>
  
  <div style="background: #ffffff; padding: 30px; border: 1px solid #e9ecef; border-radius: 0 0 8px 8px;">
    <p style="font-size: 16px;">Hello <strong>{{ user.name|default:user.email }}</strong>,</p>
    
    <p>Please confirm your email address by clicking the verification button below:</p>
    
    <div style="text-align: center; margin: 30px 0;">
      <a href="{{ activate_url }}" style="background-color: #198754; color: white; padding: 14px 28px; text-decoration: none; font-size: 16px; font-weight: bold; border-radius: 6px; display: inline-block;">
        Confirm Email Address
      </a>
    </div>
    
    <p style="color: #6c757d; font-size: 14px;">Or copy and paste this link into your browser:</p>
    <p style="background: #f8f9fa; padding: 10px; border-radius: 4px; word-break: break-all; font-size: 13px; color: #0d6efd;">
      <a href="{{ activate_url }}">{{ activate_url }}</a>
    </p>
  </div>
</body>
</html>
