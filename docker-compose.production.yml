volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}
  production_traefik: {}
  production_django_media: {}
  production_chroma_data: {}


services:
  django:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile

    image: electronics_shopping_website_production_django
    restart: unless-stopped
    volumes:
      - production_django_media:/app/electronics_shopping_website/media
      - production_chroma_data:/app/data
      - ./config/settings/production.py:/app/config/settings/production.py:ro
      - ./compose/production/django/start:/start:ro
    depends_on:
      - postgres
      - redis
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: electronics_shopping_website_production_postgres
    restart: unless-stopped
    volumes:
      - production_postgres_data:/var/lib/postgresql/18/docker
      - production_postgres_data_backups:/backups
    env_file:
      - ./.envs/.production/.postgres

  traefik:
    build:
      context: .
      dockerfile: ./compose/production/traefik/Dockerfile
    image: electronics_shopping_website_production_traefik
    restart: unless-stopped
    depends_on:
      - django
    volumes:
      - production_traefik:/etc/traefik/acme
      - ./compose/production/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'

  redis:
    image: docker.io/redis:7.2
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: ./compose/production/nginx/Dockerfile
    image: electronics_shopping_website_production_nginx
    restart: unless-stopped
    depends_on:
      - django
    volumes:
      - production_django_media:/usr/share/nginx/media:ro
      - ./compose/production/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

